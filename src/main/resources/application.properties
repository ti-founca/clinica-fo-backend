spring.application.name=clinicas-backend

# Carga las variables del archivo .env del directorio de trabajo (si existe).
# Las variables de entorno del sistema tienen prioridad sobre las del archivo.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinicas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Documentación OpenAPI: UI en /swagger-ui.html, especificación en /v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json

# CORS: orígenes del frontend autorizados a consumir /api/** (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
